[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "interpreter"
version = "0.1.0"
description = "The start of an interperter"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "jpamb",
]


[project.scripts]
interpreter_test = "interpreter:test"
interpreter_analyse = "interpreter:analyse"

[tool.uv.sources]
jpamb = { path = "../../" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

