name: Test Suite
on: [push, pull_request]
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-tests:
    name: Python Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Docker is only needed for `build` and `checkhealth --docker`, both of
      # which run on the Linux leg. The Windows leg runs the Python tool
      # natively (checkhealth without docker + pytest) against the committed
      # benchmark artifacts in target/, so no Docker/WSL is required.
      - name: Verify Docker installation
        if: runner.os == 'Linux'
        run: docker --version
      - name: Run checkhealth
        run: |
          uv run jpamb -vv checkhealth
      - name: Run build (Linux only, requires Docker)
        if: runner.os == 'Linux'
        run: |
          uv run jpamb -vv build

          # Check if something was changed
          git diff --exit-code
      - name: Run Python tests
        run: |
          uv run pytest
